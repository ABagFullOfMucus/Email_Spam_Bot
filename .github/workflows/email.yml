name: scheduled-email

on:
  schedule:
    - cron: "0 19 * * *"   # scheduled hour 
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Zero runtime dependencies — no pip install step needed.
      # Attachments: commit images into ./attachments/ and they are sent
      # automatically with every scheduled run (checked out with the repo).

      - run: python main.py
        env:
          EMAIL: ${{ secrets.EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          MESSAGE: ${{ secrets.MESSAGE }}
